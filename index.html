<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>  <div class="emoji-bg">✨ 🌟 💡 📚 🧠 🚀 ⭐ 🌍 💫 🎓</div>  <header>
    <div class="logo">🔥 Teachly</div>
    <div class="coin-pill">💰 <span id="coins">100</span></div>
  </header>  <main><!-- ROLE -->

<section id="roleScreen" class="screen active">

  <div class="hero">
    <span class="big-emoji">🎯</span>
    <h1>Welcome to Teachly</h1>
    <p>What do you want to do?</p>
  </div>

  <div class="role-grid">

    <button class="role-card teacher"
            onclick="chooseRole('teacher')">

      <span>👨‍🏫</span>
      <strong>TEACHER</strong>
      <small>Connect with a student</small>

    </button>

    <button class="role-card learner"
            onclick="chooseRole('learner')">

      <span>🎓</span>
      <strong>LEARNER</strong>
      <small>Connect with a teacher</small>

    </button>

  </div>

</section>


<!-- DASHBOARD -->

<section id="dashboardScreen" class="screen">

  <div class="hero compact">

    <h1 id="hello">Welcome! 👋</h1>

    <p id="roleText"></p>

  </div>


  <div id="mainFlow" class="card main-flow"></div>


  <div class="feature-grid">

    <button onclick="openPage('people')">
      👥
      <b>People</b>
    </button>

    <button onclick="openPage('chat')">
      💬
      <b>Chat</b>
    </button>

    <button onclick="openPage('shop')">
      🛍️
      <b>Shop</b>
    </button>

    <button onclick="openPage('badges')">
      🏆
      <b>Badges</b>
    </button>

    <button onclick="openPage('map')">
      🌍
      <b>World</b>
    </button>

    <button onclick="resetRole()">
      🔄
      <b>Change Role</b>
    </button>

  </div>

</section>


<!-- OTHER PAGES -->

<section id="pageScreen" class="screen">

  <button class="back"
          onclick="showScreen('dashboardScreen')">
    ← Back
  </button>

  <div id="pageContent"></div>

</section>


<!-- AI -->

<section id="aiScreen" class="screen">

  <div class="ai-head">

    <span>🤖</span>

    <div>

      <h1>Teachly AI Teacher</h1>

      <p>
        Ask me anything about today's lesson.
      </p>

    </div>

  </div>


  <div class="card">

    <div class="topic-box">

      <small>🎲 RANDOM TOPIC</small>

      <h2 id="aiTopic"></h2>

    </div>


    <div id="aiLesson" class="lesson"></div>

    <div id="aiChat" class="ai-chat"></div>


    <div class="ask-row">

      <input
        id="aiQuestion"
        placeholder="Ask the AI teacher..."
        onkeydown="if(event.key==='Enter') askAI()"
      >

      <button onclick="askAI()">
        Send 💬
      </button>

    </div>


    <button class="secondary full"
            onclick="newAITopic()">
      🎲 New Random Topic
    </button>


    <button class="primary full"
            onclick="showQuiz()">
      📝 Take the Quiz
    </button>

  </div>

</section>


<!-- QUIZ -->

<section id="quizScreen" class="screen">

  <button class="back"
          onclick="showScreen('aiScreen')">
    ← Back to lesson
  </button>


  <div class="card">

    <h1>📝 Quick Quiz</h1>

    <p id="quizQuestion"></p>


    <input
      id="quizAnswer"
      placeholder="Type your answer"
    >


    <button class="primary full"
            onclick="checkQuiz()">
      Submit Answer ✅
    </button>


    <p id="quizResult" class="msg"></p>

  </div>

</section>

  </main>  <!-- BOTTOM NAV -->  <nav id="bottomNav" class="bottom-nav"><button onclick="showScreen('dashboardScreen')">
  🏠
  <span>Home</span>
</button>

<button onclick="openPage('people')">
  👥
  <span>People</span>
</button>

<button onclick="openPage('chat')">
  💬
  <span>Chat</span>
</button>

<button onclick="openPage('shop')">
  🛍️
  <span>Shop</span>
</button>

  </nav>  <script src="script.js"></script></body>
</html>
